[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-migration-agent"
version = "0.1.0"
description = "An agent that migrates a multi-module Python codebase across a breaking version change"
readme = "README.md"
requires-python = ">=3.12"
# Every dependency is pinned. Add new ones here, pinned, in the same PR that uses them.
dependencies = [
    "libcst==1.9.0",
    "networkx==3.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
migrate = "migration_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
